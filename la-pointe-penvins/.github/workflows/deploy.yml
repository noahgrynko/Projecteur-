name: Build & déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Les images optimisées (AVIF/WebP) sont mises en cache entre deux builds.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-assets-

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # Sur GitHub Pages : URL et sous-chemin fournis par configure-pages.
          # Avec un domaine personnalisé, base_path est vide et origin = domaine.
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://www.lapointe-penvins.com' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          # Passer la variable de dépôt PUBLIC_INDEXABLE à « true » une fois le
          # domaine de production branché ; sinon la préversion reste en noindex.
          PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE || 'false' }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
