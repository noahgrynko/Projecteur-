name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Compilation de l'APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk projecteur-remote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: projecteur-remote-apk
          path: projecteur-remote.apk
      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: projecteur-remote.apk

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:leonardo
          sketch-paths: firmware/projir_bridge
          libraries: |
            - name: IRremote
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:nano
          sketch-paths: firmware/projir_bridge
          libraries: |
            - name: IRremote
